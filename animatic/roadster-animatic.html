<title>Roadster Animatic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: film-previz board. 9:16 frame left, beat sheet right; stacks on phones. Single deliberate dark look (editing suite). */
:root{
  --bg:#141417; --panel:#1c1c21; --line:#2c2c34; --fg:#e8e6df; --muted:#8f8d86;
  --accent:#d9322b; --amber:#e4a53a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;margin:0;text-wrap:balance}
header .sub{color:var(--muted);font-size:13px}
.frame{position:relative;width:100%;aspect-ratio:9/16;max-width:100%;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.tc{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:3px;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button,select{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.scrub{margin-top:8px}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.right{min-width:0;display:grid;gap:14px}
.now{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.now .eyebrow{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase}
.now h2{font-family:var(--display);font-size:24px;margin:4px 0 6px;font-weight:600}
.now p{margin:0;line-height:1.55;font-size:14px;max-width:62ch}
.now .why{color:var(--muted);margin-top:8px}
.now .line{margin-top:8px;font-style:italic;color:#fff}
.now .set{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--amber)}
.beats{display:grid;gap:4px}
.beat{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 10px;border-radius:4px;border:1px solid transparent;cursor:pointer;min-width:0}
.beat:hover{background:var(--panel)}
.beat.on{background:var(--panel);border-color:var(--line)}
.beat .t{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.beat .l{font-size:14px;min-width:0}
.beat .l b{display:block;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.01em}
.beat .l b i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--amber);margin-left:6px;letter-spacing:.06em}
.beat .l span{color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono&display=swap">

<div class="wrap">
  <header>
    <h1>Roadster Animatic</h1>
    <span class="sub">v14 — 54秒・18カット＋黒。監督レビュー反映：説明を圧縮、到着とオチに尺を回す、Shoの顔を早く、台詞を削る、音楽の入り／抜けを設計。</span>
  </header>

  <div class="left">
    <div class="frame">
      <canvas id="cv" width="540" height="960" aria-label="絵コンテの再生画面"></canvas>
      <div class="tc" id="tc">00.00 / 54.00</div>
    </div>
    <div class="controls">
      <button class="primary" id="play">再生</button>
      <button id="restart">最初から</button>
      <button id="loopHook">フック(0-3)</button>
      <button id="loopPick">到着〜お迎え(12-19)</button>
      <button id="loopClimb">煙幕〜壁登り(19-28)</button>
      <button id="loopJump">ランチャー〜オチ(34-51)</button>
      <select id="speed" aria-label="再生速度">
        <option value="1">等速</option>
        <option value="0.5">0.5倍</option>
        <option value="0.25">0.25倍</option>
      </select>
    </div>
    <div class="scrub">
      <input type="range" id="scrub" min="0" max="54" step="0.02" value="0" aria-label="タイムライン">
      <div class="ticks"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>54</span></div>
    </div>
    <div class="legend">
      <span><i style="background:#f4f2ea"></i>ロードスター（白・左ハンドル）</span>
      <span><i style="background:#1f3d2b"></i>Vanceの旧車（濃緑・右ハンドル）</span>
      <span><i style="background:#1c1c1c;border:1px solid #666"></i>追っ手SUV</span>
      <span><i style="background:#fff;opacity:.7"></i>圧縮空気</span>
      <span><i style="background:#ff8a2a"></i>ロケット／爆発</span>
    </div>
  </div>

  <div class="right">
    <div class="now">
      <div class="eyebrow" id="nowEye">—</div>
      <h2 id="nowTitle">—</h2>
      <div class="set" id="nowSet"></div><div class="set" id="nowMusic" style="color:#8fd3a6"></div>
      <p id="nowWhat">—</p>
      <p class="line" id="nowLine"></p>
      <p class="why" id="nowWhy">—</p>
    </div>
    <div class="beats" id="beats"></div>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=540,H=960,TOTAL=54;
let t=0,playing=false,speed=1,last=0,loopRange=null;

// ---------- beat sheet ----------
const beats=[
 {s:0,e:3,  tag:'C01 Vance主観', set:'設定3・6・10', music:'なし。銃声と風だけ', title:'右の窓を見上げると、降りてくる', what:'運転席（右）。ヒビの入ったフロントガラス越しに前方のSUVと銃火、手元に拳銃。着弾でヒビが1本増える。右の窓に影。顔を右へ、窓越しに見上げる。白い車の底面が四隅から白く噴きながら、自分の車とガードレールの間に降りてくる。窓が白で埋まる。', line:'（「キン」→上から「プシュゥッ」→白）', why:'主人公の目で見る。降りてくる"位置"をここで見せておく。'},
 {s:3,e:6,  tag:'C02 引き→窓に寄る', set:'設定1・2・3', music:'なし', title:'数分前。囲まれた。あと3発', what:'後方・高めの引き（1秒）：前後のSUV、岩壁側に寄せた濃緑のクーペ、海。白から戻り「数分前」。カメラがそのまま運転席の窓へ寄る（2秒）：ヒビだらけのガラス越しに、手の中の弾倉、残り3発。着弾が止まらない。', line:'Vance「本部。ナイン。囲まれた。あと3発。」', why:'説明3本を1本に。引きで地形、寄りで時間切れ。'},
 {s:6,e:9,  tag:'C03 引き（背後）', set:'設定4・5', music:'「了解」で低いベースが1音', title:'上。了解。', what:'Shoの後ろ姿、カップ。無線が光る。後頭部が上を向き、カメラは0.2秒遅れて追う。崖が画面を埋める、はるか上に銃火。頭が戻る。「了解」。手が0.3秒止まってから、カップを置く。', line:'Chief「ナインから。上の道。あれを使いなさい。」 Sho「上。」（間）「了解。」', why:'カメラの遅れで"見ている誰か"が生まれる。手の止まりがShoの一番嬉しい瞬間。'},
 {s:9,e:12, tag:'C06 引き', set:'設定5・6', music:'リズムが入る', title:'発進→垂直上昇', what:'岸壁。後部4基が噴く、一拍、発進。崖の手前で四隅が全開、垂直に上がって消える。', line:'（「プシュッ」→轟音→上昇音）', why:'実機の"噴射→一拍→動く"。'},
 {s:12,e:15,tag:'C06b 引き（崖の上・ロー・逆光）', set:'設定5・6', music:'頂点で音楽が一瞬止まる', title:'到着。頂点で1拍止まる', what:'崖の上の道、ガードレールの外側から。向こうは空と海だけ。白いガスが縁から吹き上がる。車の鼻先がガードレールの上に現れ、逆光で縁が光る。車体が持ち上がり、空中で一瞬止まる（1拍、長め）。画面外へ落ちていく。', line:'（上昇音→頂点で無音→落下）', why:'ヒーローの登場。3秒に伸ばした。'},
 {s:15,e:19,tag:'C07 Vance主観', set:'設定10・14', music:'小さく戻る', title:'1m先で扉が開く。Shoの顔', what:'右の窓のすぐ外、白い車の側面が壁のように。白いガスが流れる。その助手席ドアが、こっちへ開く。開いたドアの向こうにShoの顔、大きく。こっちを見て、口の端。', line:'Sho「お迎えに上がりました。」', why:'Shoの顔を早く大きく出す。ドア対ドアは主観で1mなら一発で伝わる。'},
 {s:19,e:22,tag:'C09 敵の視点', set:'設定7', music:'★消える。ファンの唸りだけ', title:'視界が白くなる', what:'全噴射口から白いガス。視界が白で埋まる。腕で顔を覆う。自分の銃だけ見える、撃つ。音が消える。', line:'（「シュワァァ」→無音→自分の銃声だけ、くぐもって）', why:'白くなった瞬間に音も消す。'},
 {s:22,e:26,tag:'C10 車内', set:'設定8', music:'なし。ファンの唸りと「ギュッ」', title:'掴まっててくださいね→地平線が回る', what:'白の中、岩壁が迫る。Shoが前を見たまま、少し楽しそうに、独り言みたいに一言。間（1秒）。壁に乗る、「ギュッ」。地平線が90度回る。Vanceの目だけShoへ、眉。', line:'Sho「掴まっててくださいね。」 Vance（眉だけ）', why:'前フリの後の間を長く。言い方で"頼れる"か"ムカつく"かが決まる。'},
 {s:26,e:28,tag:'C11 引き（崖の縁）', set:'設定5・8', music:'小さく戻る', title:'崖の縁から見下ろす', what:'足元から下へ岩壁、ずっと下に白い煙。白い車が壁を登ってこっちへ。噴射なし。', line:'（ファンの唸り）', why:'上の道へ出る動線。'},
 {s:28,e:31,tag:'C12 敵の視点', set:'—', music:'低く', title:'無言で見上げる', what:'煙が晴れる。空っぽの道。1人が上を見る、カメラも。壁の半分に白い車。全員が上を見たまま。1人が銃を下ろす。台詞なし。', line:'（無言）', why:'言葉を失った、を言葉なしで。'},
 {s:31,e:34,tag:'C13 追っ手→Vance主観', set:'設定11・12', music:'走る', title:'1発目「当たった？」2発目「弾いた」3発目「無傷」', what:'追っ手SUVから白い車の尻（2秒）：1発目、火花。2発目、火花、ガラスは無傷。3発目、火花、やっぱり無傷。Vance主観（1秒）：サイドミラーにSUV。前を向く——橋が落ちている。', line:'（バン…バン…キン）Vance「しつこいな。」', why:'3発を段階で見せる。Vanceは振り向かない。'},
 {s:34,e:36,tag:'C14 車内', set:'設定12', music:'走る', title:'橋がないが／ええ／アクセル', what:'裂け目が迫る。Vanceの手がドアハンドルへ。2語。「ええ。」の直後、Shoの足がアクセルを踏み込む音。', line:'Vance「……橋がないが。」 Sho「ええ。」（アクセル）', why:'「ええ」が返事じゃなく行動になる。'},
 {s:36,e:38,tag:'C14b 正対（撃つ側）', set:'設定12', music:'★止まる。無音', title:'筒の口がこっちを向く', what:'撃つ男に正対。SUVのフロントが画面いっぱい。後部座席の窓から上半身を乗り出した男。ランチャーの筒がカメラの真ん中を向く。0.5秒静止。発射、画面が炎で潰れる。', line:'（無音→「ボシュッ」で音が割れる）', why:'定石：撃つ瞬間は撃つ側に正対。'},
 {s:38,e:41,tag:'C15 真横・スロー', set:'設定6・9・13', music:'無音', title:'真下を抜ける瞬間だけ、さらに遅く', what:'真横、路肩の低い位置。左端にSUVの鼻先、中央に白い車、右に裂け目。0.3倍速。左からロケット、煙の尾が水平に。四隅が噴いて浮く。ロケットが車の真下を抜ける——この瞬間だけ0.15倍。裂け目の上を飛んでいく。ロール開始。', line:'（無音）', why:'スローの中に緩急。編集でやる。'},
 {s:41,e:43,tag:'C16 車内', set:'設定9', music:'無音', title:'一回転（2秒）', what:'空と海が360度。Vanceは口を閉じたまま、手の甲。Shoがハンドルを小さく切る。横の窓をロケットの煙の尾が横切る。', line:'（Vanceの息だけ）', why:'3秒→2秒。回ったと認識するのに1.5秒で足りる。'},
 {s:43,e:46,tag:'C17 引き（追っ手側から）', set:'設定13', music:'★着地の「ドン」で全開', title:'着地、ずっと奥の地面で爆発', what:'手前に裂け目のこちら側の縁。向こう岸で白い車がロールを戻して着地、ドリフトして横を向き停止。その奥——車の2倍遠く——道の地面にロケットが着弾、小さめの火球。', line:'（「ドン」→「キーーッ」→遠くで「バァン」）', why:'遠いほどShoの回避が正確だったことになる。近いと"危なかった"で格が下がる。'},
 {s:46,e:51,tag:'C18 車内', set:'設定14', music:'台詞の下で消えていく', title:'射出座席／（1秒）／車ごと飛ぶ／口の端', what:'リアガラスの向こうに遠い火球。前を向いたまま。間。Vanceの口元。Shoが一拍（1秒）考えてから、横目で返す。Vanceは何も言わず、前を見たまま、口の端だけ0.5mm上がる。黒。', line:'Vance「私のには、射出座席がついていた。」（1秒）Sho「これは、車ごと飛びますよ。」（Vance、口の端）', why:'1秒の間がShoの"生意気"を"余裕"に変える。口の端が「ありがとう」の代わり。'},
 {s:51,e:54,tag:'黒', set:'—', music:'無音', title:'ブラックアウト', what:'黒。', line:'（無音）', why:'説明しない。'},
];
const beatsEl=document.getElementById('beats');
beats.forEach((b,i)=>{
  const d=document.createElement('div'); d.className='beat';
  d.innerHTML=`<div class="t">${String(b.s).padStart(2,'0')}–${String(b.e).padStart(2,'0')}s</div><div class="l"><b>${b.title}<i>${b.tag}</i></b><span>${b.what}</span></div>`;
  d.addEventListener('click',()=>{t=b.s;loopRange=null;render();});
  beatsEl.appendChild(d);
});

// ---------- helpers ----------
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function glow(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
function gas(c,x,y,r,a=.9){ glow(c,x,y,r,`rgba(255,255,255,${a})`); glow(c,x+r*.3,y-r*.2,r*.6,`rgba(255,255,255,${a*.7})`); }
function fire(c,x,y,r,a=1){ glow(c,x,y,r,`rgba(255,120,30,${a})`); glow(c,x,y-r*.2,r*.6,`rgba(255,220,120,${a})`); glow(c,x,y-r*.6,r*.9,`rgba(60,40,30,${a*.6})`); }
function spark(c,x,y,r=16){ glow(c,x,y,r,'rgba(255,240,180,1)'); c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=2; c.beginPath(); c.moveTo(x-r*.6,y); c.lineTo(x+r*.6,y); c.moveTo(x,y-r*.6); c.lineTo(x,y+r*.6); c.stroke(); }
function cracks(c,cx,cy,n,len,alpha=.8){ c.save(); c.strokeStyle=`rgba(255,255,255,${alpha})`; c.lineWidth=1.5; for(let i=0;i<n;i++){ const a=(i/n)*6.283+Math.sin(i*7)*.3; c.beginPath(); c.moveTo(cx,cy); let x=cx,y=cy; for(let k=0;k<4;k++){ x+=Math.cos(a+Math.sin(k*3+i)*.4)*len/4; y+=Math.sin(a+Math.sin(k*3+i)*.4)*len/4; c.lineTo(x,y); } c.stroke(); } c.beginPath(); c.arc(cx,cy,len*.3,0,7); c.stroke(); c.restore(); }
function sky(c){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5b8fc9');g.addColorStop(.55,'#a9c6e3');g.addColorStop(1,'#e9d7b8');c.fillStyle=g;c.fillRect(0,0,W,H);}
function sun(c){glow(c,W*.82,H*.30,160,'rgba(255,230,180,.9)');c.fillStyle='#fff3d6';c.beginPath();c.arc(W*.82,H*.30,26,0,7);c.fill();}
function sea(c,y0){const g=c.createLinearGradient(0,y0,0,H);g.addColorStop(0,'#2f7fb3');g.addColorStop(1,'#154b73');c.fillStyle=g;c.fillRect(0,y0,W,H-y0);
  c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1;for(let i=0;i<14;i++){c.beginPath();c.moveTo(0,y0+30+i*40);c.lineTo(W,y0+36+i*40);c.stroke();}}
function cliffRoadDay(c){
  sky(c); sun(c); sea(c,H*.46);
  c.fillStyle='#d9c3a0'; c.beginPath(); c.moveTo(0,0); c.lineTo(W*.34,0); c.lineTo(W*.30,H*.50); c.lineTo(0,H); c.closePath(); c.fill();
  c.fillStyle='rgba(120,90,60,.25)'; for(let i=0;i<12;i++){ c.fillRect(0,i*80,W*.30-i*5,6); }
  c.fillStyle='#5b5b5e'; c.beginPath(); c.moveTo(0,H); c.lineTo(W*.60,H); c.lineTo(W*.46,H*.50); c.lineTo(W*.30,H*.50); c.closePath(); c.fill();
  c.strokeStyle='#e5dcc3'; c.setLineDash([16,20]); c.lineWidth=3; c.beginPath(); c.moveTo(W*.28,H); c.lineTo(W*.38,H*.50); c.stroke(); c.setLineDash([]);
  c.strokeStyle='#9aa0a6'; c.lineWidth=5; c.beginPath(); c.moveTo(W*.61,H); c.lineTo(W*.465,H*.51); c.stroke();
  c.fillStyle='rgba(40,30,20,.25)'; c.beginPath(); c.moveTo(0,H); c.lineTo(W*.30,H); c.lineTo(W*.36,H*.50); c.lineTo(W*.30,H*.50); c.closePath(); c.fill();
}
function harbor(c){
  sky(c); sun(c);
  c.fillStyle='#d9c3a0'; c.beginPath(); c.moveTo(0,0); c.lineTo(W*.62,0); c.lineTo(W*.42,H*.58); c.lineTo(0,H*.58); c.closePath(); c.fill();
  c.fillStyle='rgba(60,40,25,.25)'; for(let i=0;i<10;i++) c.fillRect(0,i*55,W*.5-i*8,5);
