<title>C12 Blocking Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one-screen app, 3D canvas fills, control bar at the bottom, legend top-left */
:root{
  --bg:#1a1c20; --panel:rgba(26,28,32,.78); --fg:#e9e6df; --muted:#9a9890; --line:#3a3d44;
  --accent:#f2b705; --hero:#e6e1d6; --enemy:#ff7a45;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eceae4;--panel:rgba(236,234,228,.82);--fg:#1d1f24;--muted:#5d5f66;--line:#c9c6bd;--accent:#b8860b;--hero:#2b2d33;--enemy:#c2410c;color-scheme:light}}
:root[data-theme="light"]{--bg:#eceae4;--panel:rgba(236,234,228,.82);--fg:#1d1f24;--muted:#5d5f66;--line:#c9c6bd;--accent:#b8860b;--hero:#2b2d33;--enemy:#c2410c;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
#app{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%}
.panel{position:absolute;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
#legend{top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(340px,calc(100vw - 32px))}
#legend h1{font:600 14px/1.2 var(--sans);margin:0 0 6px;letter-spacing:.02em}
#legend p{margin:0 0 6px;color:var(--muted);line-height:1.45}
#legend ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-family:var(--mono);font-size:12px}
#legend li b{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#bar{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:600 13px var(--sans);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#111;border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#time{flex:1 1 180px;min-width:0;accent-color:var(--accent)}
#clock{font:600 14px var(--mono);font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}
#beat{font-size:12px;color:var(--muted);flex-basis:100%;min-height:1.4em}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<div id="app">
  <div id="legend" class="panel">
    <h1>C12 配置ビューア（グレーボックス）</h1>
    <p>ドラッグで回転、ホイールでズーム、右ドラッグで移動。「カメラ視点」で本番の画角に切り替え。単位 m、道路は +Y。</p>
    <ul>
      <li><b style="background:#e6e1d6"></b>Roadster（壁 x=−4, y=11.5, z 5→25m）</li>
      <li><b style="background:#bfbfc4"></b>VanceGT（−2.8, 10）無人</li>
      <li><b style="background:#333"></b>SUV_rear（y=−5）＝盾 ／ SUV_front（y=32）</li>
      <li><b style="background:var(--enemy)"></b>Men A–D（y≈−6.7、SUVの陰）</li>
      <li><b style="background:var(--accent)"></b>Cam（0.8, −16, 2.0）24mm</li>
    </ul>
  </div>
  <div id="bar" class="panel">
    <button id="play" aria-pressed="false">▶ 再生</button>
    <input id="time" type="range" min="0" max="5" step="0.02" value="0" aria-label="時間（秒）">
    <span id="clock">0.00s</span>
    <button id="camview" aria-pressed="false">カメラ視点</button>
    <button id="topview" aria-pressed="false">真上</button>
    <button id="loop" aria-pressed="true">ループ</button>
    <div id="beat"></div>
  </div>
</div>

</script>

const scene=new THREE.Scene();

  const c=document.createElement('canvas'); c.width=256; c.height=64; const g=c.getContext('2d');

  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  s.scale.set(4,1,1); return s;
}

const glbBuf=Uint8Array.from(atob(GLB_B64),c=>c.charCodeAt(0)).buffer;
new GLTFLoader().parse(glbBuf,'',(gltf)=>{
  scene.add(gltf.scene);
  gltf.scene.traverse(o=>{
    if(o.isMesh){ o.material.side=THREE.DoubleSide; if(/Vapor/.test(o.name)){o.material.transparent=true;o.material.opacity=0.45;} }
    if(o.name==='Cam') camNode=o; if(o.name==='Top') topNode=o;
  });
  // labels on the named roots
  const tags={ManA:['A','#ff7a45'],ManB:['B','#ff7a45'],ManC:['C','#ff7a45'],ManD:['D','#ff7a45'],
              VanceGT:['VanceGT','#bfbfc4'],SUV_rear:['SUV 盾','#dddddd'],SUV_front:['SUV','#dddddd'],Hero_root:['Roadster','#e6e1d6'],Cam:['Cam','#f2b705']};
  for(const [n,[t,col]] of Object.entries(tags)){ const o=gltf.scene.getObjectByName(n); if(!o) continue; const s=label(t,col); s.position.y+= (n.startsWith('Man')?2.4:(n==='Hero_root'?3.5:2.6)); o.add(s); }
  mixer=new THREE.AnimationMixer(gltf.scene);
  clips=gltf.animations; duration=Math.max(5,...clips.map(c=>c.duration));
  clips.forEach(c=>{const a=mixer.clipAction(c); a.play(); a.clampWhenFinished=true;});
  setTime(0);
});

const timeEl=document.getElementById('time'), clock=document.getElementById('clock'), beatEl=document.getElementById('beat');
let t=0, playing=false, last=performance.now(), useCam=false, useTop=false, loop=true;
function setTime(v){ t=Math.max(0,Math.min(5,v)); if(mixer) mixer.setTime(t); timeEl.value=t.toFixed(2); clock.textContent=t.toFixed(2)+'s';
  const b=beats.find(([a,z])=>t>=a&&t<z)||beats[beats.length-1]; beatEl.textContent=b[2]; }
timeEl.addEventListener('input',e=>setTime(parseFloat(e.target.value)));
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{playing=!playing; playBtn.setAttribute('aria-pressed',playing); playBtn.textContent=playing?'❚❚ 停止':'▶ 再生'; last=performance.now();};
const camBtn=document.getElementById('camview'), topBtn=document.getElementById('topview'), loopBtn=document.getElementById('loop');
camBtn.onclick=()=>{useCam=!useCam; if(useCam) useTop=false; camBtn.setAttribute('aria-pressed',useCam); topBtn.setAttribute('aria-pressed',useTop); controls.enabled=!useCam&&!useTop;};
topBtn.onclick=()=>{useTop=!useTop; if(useTop) useCam=false; camBtn.setAttribute('aria-pressed',useCam); topBtn.setAttribute('aria-pressed',useTop); controls.enabled=!useCam&&!useTop;};
loopBtn.onclick=()=>{loop=!loop; loopBtn.setAttribute('aria-pressed',loop);};

function resize(){ const w=app.clientWidth,h=app.clientHeight; renderer.setSize(w,h,false); free.aspect=w/h; free.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

function activeCamera(){
  if(useCam&&camNode){ const c=camNode.children.find(ch=>ch.isCamera)||camNode; const cam=c.isCamera?c:free;
    if(cam.isPerspectiveCamera){ cam.aspect=9/16; cam.updateProjectionMatrix(); } return cam; }
  if(useTop&&topNode){ const c=topNode.children.find(ch=>ch.isCamera); if(c){ c.updateProjectionMatrix(); return c; } }
  return free;
}
function frame(now){
  requestAnimationFrame(frame);
  if(playing){ const dt=(now-last)/1000; last=now; let nt=t+dt; if(nt>5){ nt=loop?0:5; if(!loop){playing=false;playBtn.setAttribute('aria-pressed',false);playBtn.textContent='▶ 再生';} } setTime(nt); }
  else last=now;
  if(controls.enabled) controls.update();
  const cam=activeCamera();
  if(cam!==free){ // letterbox the 9:16 shot inside the canvas
    const W=app.clientWidth,H=app.clientHeight; const vh=H, vw=Math.min(W, H*9/16); const x=(W-vw)/2;
    renderer.setScissorTest(true); renderer.setClearColor(0x000000); renderer.clear();
    renderer.setViewport(x,0,vw,vh); renderer.setScissor(x,0,vw,vh);
    if(cam.isPerspectiveCamera){cam.aspect=vw/vh;cam.updateProjectionMatrix();}
    renderer.render(scene,cam); renderer.setScissorTest(false); renderer.setViewport(0,0,W,H);
  } else { renderer.setClearColor(scene.background); renderer.render(scene,free); }
}
requestAnimationFrame(frame);
</script>
